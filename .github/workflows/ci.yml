name: DataDeck release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py production_start.py billing_service.py core/*.py billing/*.py consulting/*.py qa*.py
      - run: python qa_secret_scan.py
      - run: python qa_all.py
      - run: python -m pip check
      - run: pip-audit -r requirements.txt

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: datadeck
          POSTGRES_USER: datadeck
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datadeck -d datadeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://datadeck@127.0.0.1:5432/datadeck
      DATADECK_INTEGRATION_DATABASE_URL: postgresql://datadeck@127.0.0.1:5432/datadeck
      DB_POOL_MAX_SIZE: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m billing.migrate --dry-run
      - run: python -m billing.migrate
      - run: python qa_persistence.py
