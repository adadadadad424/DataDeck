name: DataDeck release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py production_start.py billing_service.py core/*.py billing/*.py qa*.py
      - run: python qa_test_final.py
      - run: python qa_runtime.py
      - run: python qa_beta_security.py
      - run: python qa_production.py
      - run: python qa_golden_datasets.py
      - run: python qa_billing.py
      - run: python -m pip check
      - run: pip-audit -r requirements.txt
