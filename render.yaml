services:
  - type: web
    name: datadeck-beta
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: STRIPE_MODE
        value: test
      - key: GEMINI_MODEL_NAME
        value: gemini-3.8-flash
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: MAX_DATASET_COLUMNS
        value: "250"
      - key: MAX_XLSX_SHEETS
        value: "25"
      - key: MAX_XLSX_UNCOMPRESSED_MB
        value: "100"
      - key: MAX_XLSX_ENTRIES
        value: "2000"
      - key: MAX_XLSX_XML_MB
        value: "32"
      - key: MAX_SOURCE_ROWS
        value: "250000"
      - key: MAX_CSV_FIELD_CHARS
        value: "100000"
      - key: MAX_FILE_PARSE_SECONDS
        value: "20"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DB_POOL_MIN_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "4"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_CIRCUIT_FAILURES
        value: "3"
      - key: GEMINI_CIRCUIT_COOLDOWN_SECONDS
        value: "60"
      - key: OIDC_SERVER_METADATA_URL
        value: https://accounts.google.com/.well-known/openid-configuration
      - key: OIDC_COOKIE_SECRET
        generateValue: true
      - key: BETA_APPROVED_USERS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: LEGAL_IMPRINT_URL
        sync: false
      - key: LEGAL_PRIVACY_URL
        sync: false
      - key: LEGAL_TERMS_URL
        sync: false
      - key: BETA_FEEDBACK_URL
        sync: false
